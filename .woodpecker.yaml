steps:
  build:
    image: nimlang/nim:2.2.4-alpine
    commands:
      - apk add --no-cache gcc musl-dev openssl-dev pcre-dev git curl
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - nimble install --depsOnly -y
      - nimble test
      - nimble release
    when:
      - event: push
      - event: pull_request
      - event: tag

  package_release:
    image: alpine:3.22
    commands:
      - mkdir -p dist
      - cp build/k8s-image-availability-exporter dist/k8s-image-availability-exporter-linux-amd64
      - cp LICENSE THIRD_PARTY_NOTICES dist/
      - sha256sum dist/k8s-image-availability-exporter-linux-amd64 > dist/k8s-image-availability-exporter-linux-amd64.sha256
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  helm:
    image: alpine/helm:3.15.4
    commands:
      - cp LICENSE helm/k8s-image-availability-exporter/LICENSE
      - helm lint helm/k8s-image-availability-exporter
      - >
        helm template k8s-image-availability-exporter helm/k8s-image-availability-exporter
        --namespace monitoring
        --set podMonitor.enabled=true
        --set prometheusRule.enabled=true
      - helm package helm/k8s-image-availability-exporter --destination build/helm
    when:
      - event: push
      - event: pull_request
      - event: tag

  publish_helm:
    image: alpine/helm:3.15.4
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - echo "$${GHCR_TOKEN}" | helm registry login ghcr.io --username "$CI_REPO_OWNER" --password-stdin
      - helm push build/helm/*.tgz "oci://ghcr.io/$CI_REPO_OWNER/charts"
    depends_on:
      - helm
    when:
      - event: tag
        ref: refs/tags/v*

  publish_image:
    image: woodpeckerci/plugin-docker-buildx:5.2.0
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: ghcr_token
      platforms:
        - linux/amd64
        - linux/arm64
      build_args:
        - VERSION=${CI_COMMIT_TAG##v}
      tags:
        - ${CI_COMMIT_TAG##v}
        - ${CI_COMMIT_TAG}
        - latest
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_release:
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api-key:
        from_secret: github_token
      files:
        - dist/*
      file-exists: overwrite
      generate-release-notes: true
      title: ${CI_COMMIT_TAG}
    depends_on:
      - package_release
      - publish_helm
      - publish_image
    when:
      - event: tag
        ref: refs/tags/v*

  renovate:
    image: renovate/renovate:latest
    commands:
      - renovate "$CI_REPO"
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN:
        from_secret: renovate_token
    when:
      - event: cron
        cron: renovate
      - event: manual
